name: Build CleanYourTV v2.7.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Launcher APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v2.7.0
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: v2.7.0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-v2.7.0-APK
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
          
